
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AMS</title>

  <meta name="theme-color" content="#063d2b">
  <meta name="apple-mobile-web-app-title" content="AMS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png?v=3">
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #063d2b, #011b13);
      color: white;
      font-family: -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .container { max-width: 380px; }

    img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 28px;
    }

    h1 { letter-spacing: 5px; }

    p { color: #d0e5d9; line-height: 1.6; }

    a {
      display: block;
      margin-top: 30px;
      padding: 17px;
      border-radius: 14px;
      background: #e8bd51;
      color: #102b1d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="./apple-touch-icon.png?v=3" alt="AMS Logo">
    <h1>AMS</h1>
    <p>Your business management application.</p>

    <a href="https://script.google.com/macros/s/AKfycbz9O0ZXtYsEmzL5bO1wb_1OYlNQIhdCkGW9qAVDv4aveLSc6V-TW7pdvcDMlcA9PGVP8A/exec">
      Open AMS
    </a>
  </div>
</body>
</html>
